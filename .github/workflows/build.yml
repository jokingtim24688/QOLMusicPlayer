name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # publish the installer to a GitHub Release on version tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          # Version lives in CMakeLists.txt (QOL_VERSION); a v* tag overrides it.
          $v = (Select-String -Path CMakeLists.txt -Pattern 'set\(QOL_VERSION "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          "QOL_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: cmake -S . -B build -A x64 -DQOL_VERSION=${{ env.QOL_VERSION }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=$env:QOL_VERSION" installer\QOLOverlay.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: QOLOverlay
          path: |
            build/Release/QOLOverlay.exe
            installer/Output/QOLOverlay-Setup.exe

      # Publishes (or refreshes) release v<version> with the installer, so the one-line install command
      # (releases/latest/download/QOLOverlay-Setup.exe) always gets the newest build of the release branch.
      - name: Publish release
        if: >-
          github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') ||
          github.ref_name == github.event.repository.default_branch ||
          github.ref_name == 'claude/vibrant-heisenberg-5xg2ip')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.QOL_VERSION }}
          target_commitish: ${{ github.sha }}
          name: QOL Overlay ${{ env.QOL_VERSION }}
          body: |
            Install or update by pasting this into PowerShell:
            ```powershell
            $f="$env:TEMP\QOLOverlay-Setup.exe"; irm https://github.com/${{ github.repository }}/releases/latest/download/QOLOverlay-Setup.exe -OutFile $f; Start-Process $f
            ```
          files: installer/Output/QOLOverlay-Setup.exe
          overwrite_files: true
          make_latest: true
