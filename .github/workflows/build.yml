name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # publish the installer to a GitHub Release on version tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.2.0' }
          "QOL_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: cmake -S . -B build -A x64 -DQOL_VERSION=${{ env.QOL_VERSION }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=$env:QOL_VERSION" installer\QOLOverlay.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: QOLOverlay
          path: |
            build/Release/QOLOverlay.exe
            installer/Output/QOLOverlay-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/QOLOverlay-Setup.exe
          make_latest: true
